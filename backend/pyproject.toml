[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daou-athena-backend"
version = "0.1.0"
description = "FastAPI facade for the Kiwoom mock REST and WebSocket APIs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "ladybug==0.19.1",
  "mcp==1.28.*",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=15,<16",
]

[project.scripts]
# `.mcp.json`이 `{"command": "athena-mcp", "args": ["serve"]}`로 부르는 진입점.
athena-mcp = "athena_mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-xdist>=3.6,<4",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["athena_api", "athena_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["athena_api/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
