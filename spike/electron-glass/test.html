<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { position: relative; width: 100%; height: 100%; }
  .label {
    position: absolute; top: 14px; left: 14px; font-size: 14px; font-weight: 700;
    background: rgba(0,0,0,0.65); padding: 4px 10px; border-radius: 4px;
  }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .big { font-size: 44px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .numbers { font-size: 24px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  /* mode=d only: no OS-level transparency, prove CSS backdrop-filter alone cannot reveal real desktop */
  .d-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #202030, #101018);
  }
  .d-decor {
    position: absolute; width: 60%; height: 60%; left: 20%; top: 20%;
    background: repeating-linear-gradient(45deg, #ff3b3b 0 40px, #ffb400 40px 80px, #34d058 80px 120px, #2ea1ff 120px 160px);
    opacity: 0.9;
  }
  .d-panel {
    position: absolute; inset: 15%;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    background: rgba(20,20,30,0.35);
    border-radius: 16px;
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="label" id="label"></div>
    <div class="center">
      <div class="big">ATHENA GLASS TEST</div>
      <div class="numbers">0123456789 코스피 2,634.12 ▲1.2%</div>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || '?';
  document.getElementById('label').textContent = 'combo ' + mode;
  if (mode === 'd') {
    const wrap = document.getElementById('wrap');
    const bg = document.createElement('div'); bg.className = 'd-bg';
    const decor = document.createElement('div'); decor.className = 'd-decor';
    const panel = document.createElement('div'); panel.className = 'd-panel';
    wrap.prepend(panel);
    wrap.prepend(decor);
    wrap.prepend(bg);
  }
</script>
</body>
</html>
