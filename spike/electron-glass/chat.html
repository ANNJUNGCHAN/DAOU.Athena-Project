<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; color: #d8dae2; }
  .panel {
    position: absolute; inset: 0;
    background: rgba(20, 22, 28, 0.82);
    display: flex; align-items: center; padding: 0 28px; box-sizing: border-box;
    gap: 16px;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #7fb8ff 40%, #3a6fd8 100%);
    box-shadow: 0 0 14px 4px rgba(90, 150, 255, 0.65);
    flex-shrink: 0;
  }
  .placeholder { color: #6c7280; font-size: 15px; }
  .label { position: absolute; top: 8px; left: 16px; font-size: 12px; color: #8a8f9c; }
</style>
</head>
<body>
  <div class="panel">
    <div class="dot" id="dot"></div>
    <div class="placeholder">무엇이든 물어보세요…</div>
  </div>
  <div class="label">CHAT 1560×204</div>
</body>
</html>
