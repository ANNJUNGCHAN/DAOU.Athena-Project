<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Athena</title>
<!-- 셸 창 문서 — Codex형 창 모델(2026-08-24 리프 1.2.1). 옛 판은 chat.html과
     canvas.html 두 문서가 각자의 OS 창에 떴다. 이제 한 문서 안의 두 영역이다.
     스타일 순서가 계약이다: canvas.css·chat.css는 자기 창을 전제로 `position:fixed;
     inset:0`을 쓰므로, shell.css가 **그 뒤에서** 영역 스코프로 되돌린다.
     access.css는 언제나 마지막 — 접근성 3종이 다른 규칙을 이겨야 한다. -->
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/ui-kit.css" />
<link rel="stylesheet" href="canvas.css" />
<link rel="stylesheet" href="chat.css" />
<link rel="stylesheet" href="styles/settings-cards.css" />
<link rel="stylesheet" href="styles/card-kinds.css" />
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="styles/access.css" />
</head>
<body>
  <!-- 부팅(AT-SY-001) — 4단계 생성 시퀀스. 별도 스플래시가 아니라 창 자신이
       생성되는 연출이다: 발광점(0ms) → 가로 확장(+180ms) → 세로 전개(+420ms)
       → 창 확정(+620ms). 확정된 바의 입력줄에 ATHENA가 한 자씩 적혔다가 지워지고
       placeholder로 돌아온 상태에서 실제 셸(#shell)로 스왑한다. 시퀀스는 chat.js가
       클래스 토글로 구동한다(리프 1.2.1에서 창 높이 의존을 걷어냈다 — 연출 자체는
       그대로다). -->
  <div id="boot" class="boot">
    <div class="boot-line" id="bootLine"></div>
    <div class="boot-panel" id="bootPanel">
      <div class="boot-body"></div>
      <div class="boot-inputbar">
        <div class="boot-input-line">
          <span class="boot-name" id="bootName"></span>
          <span class="boot-cursor"></span>
          <span class="boot-ph" id="bootPh" hidden>무엇이든 물어보세요</span>
        </div>
        <div class="boot-strip">
          <span class="boot-dot"></span>
          <span class="boot-pill">CLAUDE</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 셸 — 창 표면(유리 사다리의 `--glass-window` 단)이 여기다. 옛 판에서는
       대화 창의 `.app`이 창 표면이었는데, 이제 `.app`은 셸 위의 한 영역이라
       표면 역할을 셸이 가져간다(verify.js 검증16이 이 요소를 읽는다). -->
  <div id="shell" class="shell" hidden>
    <!-- 좌측 이력 사이드바 268px(리프 1.2.2, Paper 보드 04/05/08/16) — 머리(새
         대화·검색) · 이력 목록(날짜 섹션 + 알림 파생 방) · 발치(활성 계좌 행).
         데이터는 lib/sidebar.js가 athena:conversations-list·athena:account-list·
         athena:routine-event로 채운다 — 하드코딩된 목업 없음. -->
    <nav id="historyRegion" class="shell-region">
      <div class="sidebar-head">
        <button id="sidebarNewChat" class="sidebar-head-btn" type="button">
          <span class="sidebar-head-ic" aria-hidden="true">+</span>
          <span>새 대화</span>
        </button>
        <button id="sidebarSearchToggle" class="sidebar-head-btn" type="button">
          <span class="sidebar-head-ic" aria-hidden="true">⌕</span>
          <span>대화 검색</span>
        </button>
        <input id="sidebarSearchInput" class="sidebar-search-input" type="text" placeholder="대화 검색" hidden />
      </div>
      <!-- 모드 네비(v2, 보드 37/38/44, 스텝16) — #graphPill(그래프 진입/이탈
           토글, 지금 모드 배지)은 존치한 채(리드 결정 — 근거는 Paper 보드44
           캡션 수정 참고: 커밋 33d3975 "모드 칩 상시 노출"이 최신 규범), 이
           네비를 새 주 진입로로 추가한다. "그래프" 항목은 lib/sidebar.js가
           window.AthenaGraphMode.toggle()을 재사용해 배선한다(새 상태 기계
           없음) — "대화"/"에이전트"는 이번 갭 분석 범위 밖(§6)이라 UI만 두고
           클릭 배선은 안 한다. 정적 마크업의 is-active는 부팅 기본값(답변
           모드)일 뿐 진짜 소유자는 sidebar.js다(US-007과 같은 교훈 — 정적
           속성이 우연히 맞는 데 기대지 않는다). -->
      <div id="sidebarModeNav" class="sidebar-mode-nav">
        <div class="sidebar-mode-label">모드</div>
        <button id="sidebarModeChat" class="sidebar-mode-item is-active" type="button">
          <svg class="sidebar-mode-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 3.5C2 2.67 2.67 2 3.5 2h7C11.33 2 12 2.67 12 3.5v4C12 8.33 11.33 9 10.5 9H5.5L3 11.5V9h0C2.67 9 2 8.33 2 7.5v-4Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
          <span>대화</span>
        </button>
        <button id="sidebarModeGraph" class="sidebar-mode-item" type="button">
          <svg class="sidebar-mode-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <line x1="4" y1="4" x2="10" y2="4" stroke="currentColor" stroke-width="1.2" />
            <line x1="4" y1="4" x2="7" y2="10" stroke="currentColor" stroke-width="1.2" />
            <circle cx="4" cy="4" r="1.8" stroke="currentColor" stroke-width="1.2" />
            <circle cx="10" cy="4" r="1.8" stroke="currentColor" stroke-width="1.2" />
            <circle cx="7" cy="10" r="1.8" stroke="currentColor" stroke-width="1.2" />
          </svg>
          <span>그래프</span>
        </button>
        <button id="sidebarModeAgent" class="sidebar-mode-item" type="button">
          <svg class="sidebar-mode-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1.5l1.4 3.6 3.8.4-2.9 2.5.9 3.7L7 9.7 3.8 11.7l.9-3.7L1.8 5.5l3.8-.4L7 1.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" />
          </svg>
          <span>에이전트</span>
          <!-- 배지 = 미확인 알람 수(보드44 원칙2) — sidebar.js의 기존 notifyRooms(라우틴
               발화, athena:routine-event) 미확인 개수를 그대로 재사용한다(지어낸
               숫자 없음, §0 정책) — 0이면 숨긴다. -->
          <span id="sidebarModeAgentBadge" class="sidebar-mode-badge" hidden></span>
        </button>
      </div>
      <div class="sidebar-divider"></div>
      <div id="sidebarList" class="sidebar-list"></div>
      <div id="sidebarAccountMenu" class="sidebar-account-menu" hidden></div>
      <button id="sidebarAccountRow" class="sidebar-account-row" type="button" hidden>
        <span class="sidebar-account-dot" id="sidebarAccountDot" aria-hidden="true"></span>
        <span class="sidebar-account-text">
          <span id="sidebarAccountAlias" class="sidebar-account-alias"></span>
          <span id="sidebarAccountToken" class="sidebar-account-token"></span>
        </span>
        <span class="sidebar-account-caret" aria-hidden="true">⌃</span>
      </button>
    </nav>

    <!-- 중앙 캔버스 — 유일한 출력 지점. 늘 떠 있다(옛 판의 확장/수축 연출 없음). -->
    <main id="canvasRegion" class="shell-region">
      <div id="mosaic" class="mosaic glass">
        <div id="grid" class="grid"></div>
        <!-- 캔버스 빈 상태(보드 05) — #grid의 형제. 카드가 0장일 때만 보인다
             (canvas.js MutationObserver). 숫자·CTA를 담아야 해서 CSS :empty
             pseudo-content로는 못 그린다 — 실DOM이다. -->
        <div id="gridEmpty" class="canvas-empty-wrap" hidden></div>
      </div>
      <!-- 보드 07 — 그래프 모드 요약 뷰의 성향 신호 표. #mosaic·#graphCanvas와
           형제다(예전엔 #mosaic의 자식이라 그래프 모드에서 #mosaic가 hidden되면
           함께 가려져 화면에 안 뜨는 결함이 있었다 — 2026-08-27 수정). 안쪽은
           헤더(#graphSummaryHeader, 스텝2가 채운다)·본문(#graphSummaryTableArea+
           #graphPanel 좌우, 스텝4/스텝8이 채운다) 2단 구조다 — applyVisibility()가
           이 바깥 카드의 hidden만 소유하면 안쪽은 별도 hidden 로직 없이 함께 숨는다. -->
      <div id="graphSummaryTable" class="mosaic glass" hidden>
        <!-- #graphSummaryHeader — 스텝2가 뷰 토글(요약/그래프)·필터 칩·"최근 갱신"을
             채운다. 이 토글은 그래프 기능 진입(#dot/#graphPill, graphMode.toggle())과는
             다른 축이다 — graphMode.setSurface()가 state.surface를 바꾸고,
             applyVisibility() 하나가 여전히 hidden 전체(elements.graph/summaryTable
             둘 다)를 소유한다(스텝2-보정, US-007 계약 유지). 요약/지도 두 표면이
             동시에 hidden=false였던 z-index 임시조치(옛 .graph-surface-back,
             canvas.js의 옛 focusGraphSurface())는 걷어냈다 — 실측: 두 카드 다
             92% 불투명이라 완전히 안 가려지고 뒤 레이어 텍스트가 비쳤었다. -->
        <div id="graphSummaryHeader">
          <div class="summary-header-left">
            <div class="view-toggle" role="tablist">
              <button type="button" id="summaryViewTab" class="view-toggle-tab is-active" role="tab" aria-selected="true">요약</button>
              <button type="button" id="graphViewTab" class="view-toggle-tab" role="tab" aria-selected="false">그래프</button>
            </div>
            <!-- 실데이터(entries[].observed_at 중 최신)로만 채운다 — Paper 목업
                 "12분 전"을 그대로 박지 않는다. 표를 아직 못 읽었으면(빈 목록) 숨은 채로 둔다. -->
            <span id="summaryUpdatedAt" class="summary-updated-at" hidden></span>
          </div>
          <div class="summary-header-right">
            <!-- 필터 칩 — Paper가 활성/비활성 시각차·인터랙션 스펙을 안 그려서
                 정적 라벨로만 둔다(열린 질문 5, 클릭 기능 발명하지 않음). -->
            <span class="filter-chip">최근 90일</span>
            <span class="filter-chip">보강 순</span>
          </div>
        </div>
        <div id="graphSummaryBody">
          <div id="graphSummaryMain">
            <!-- 히어로(보드 06 §5) — 사실/추론/불확실 % 실계산값만. "반도체 대형주
                 중심..." 같은 자연어 타이틀 문장은 profile-summary 어디에도 없어
                 짓지 않는다(§0 정책, summary-table.js renderSummaryHero). -->
            <div id="graphSummaryHero"></div>
            <!-- 확인 필요 배너(보드 06 §6, 06 전용 — 07엔 없음). 개수는
                 athena:brain-suggested-questions 실값(summary-table.js). -->
            <div id="graphConfirmBanner" class="confirm-banner" hidden></div>
            <!-- 표 렌더 대상. summary-table.js의 renderSummaryTable()이 매 렌더마다
                 이 컨테이너의 자식만 통째로 비운다(summary-table.js:67) — #graphPanel은
                 그 바깥 형제라 표 리로드가 패널을 지울 방법이 구조적으로 없다. -->
            <div id="graphSummaryTableArea"></div>
            <!-- 테마 군집(보드 06 §8/07 §8-2) — theme-clusters.js. 군집 이름은
                 백엔드 어디에도 없어(§0 발견1) 전 카드가 "이름 없음"이다. -->
            <div id="graphThemeClusters"></div>
            <!-- 숨은 연관(보드 06 §9/07 §9-2) — hidden-links.js. "점수 8.5" 같은
                 근거 없는 수치는 없다(§0 발견3, SurprisingConnectionOut에 없음). -->
            <div id="graphHiddenLinks"></div>
          </div>
          <!-- 공통 패널(보드 07/15) — 스텝8이 채운다. controller.js의
               renderSelection()이 hidden·텍스트만 갱신한다(통째로 비우지 않는다). -->
          <div id="graphPanel" class="graph-panel" hidden></div>
        </div>
      </div>
      <!-- 그래프 모드 — 요약(위 모자이크)과 **형제**다. 둘 중 하나만 보인다.
           canvasRegion 전체를 토글하는 것이 결정(deep-interview Round 5). 기본은
           요약 서브뷰가 보인다(state.surface 기본값 'summary' — graph-mode-store.js,
           applyVisibility()가 이 카드의 hidden을 그 값으로 결정한다, 스텝2-보정).
           안쪽은 헤더(#graphHeader, 스텝9가 채운다)·본문(#graphBody, 렌더·클릭위임·크기측정
           전용) 2단 구조다. -->
      <div id="graphCanvas" class="mosaic glass" hidden>
        <!-- #graphHeader(보드 14/15 §1.2/1.3, 스텝9) — 뷰 토글(step2 헤더와 같은
             .view-toggle/.filter-chip 클래스 재사용, 클릭은 graphMode.setSurface(),
             z-index 금지)+메타 텍스트(controller.js가 state.stage로 계산)+필터 칩,
             그 아래 지도 안내 바(#graphMapGuide, 1단계에서만 보임 —
             controller.js가 elements.mapGuide.hidden으로 소유). -->
        <div id="graphHeader">
          <div class="graph-header-top">
            <div class="summary-header-left">
              <div class="view-toggle" role="tablist">
                <button type="button" id="graphHeaderSummaryTab" class="view-toggle-tab" role="tab" aria-selected="false">요약</button>
                <button type="button" id="graphHeaderMapTab" class="view-toggle-tab is-active" role="tab" aria-selected="true">그래프</button>
              </div>
              <span id="graphHeaderMeta" class="summary-updated-at"></span>
            </div>
            <div class="summary-header-right">
              <!-- 필터 칩 — Paper가 활성/비활성 시각차·인터랙션 스펙을 안 그려서
                   정적 라벨로만 둔다(스텝2와 같은 판단, 열린 질문 5). -->
              <span class="filter-chip">최근 90일</span>
              <span class="filter-chip">보강 2회 이상</span>
            </div>
          </div>
          <div id="graphMapGuide" class="graph-map-guide">
            <span class="graph-map-guide-title">테마 지도</span>
            <span class="graph-map-guide-desc">군집을 누르면 그 안의 종목·테마가 펼쳐집니다 · 채팅으로 물어도 같은 곳이 열립니다</span>
          </div>
        </div>
        <div id="graphBody"></div>
      </div>
      <div class="glass-sheen" id="sheen" aria-hidden="true"></div>
    </main>

    <!-- 우측 채팅 400px — 유일한 입력 지점. **어떤 상태에서도 접히지 않는다**
         (GLOSSARY §1). shell.css의 flex-shrink:0이 그 계약이다. -->
    <section id="chatRegion" class="shell-region">
      <div id="app" class="app glass" hidden>
        <!-- 알림 파생 방 머리(Paper 보드 08) — 사이드바 "알림에서" 항목을 선택했을 때만
             보인다. 메인 대화와 섞이지 않는다는 문구가 계약이다 — lib/sidebar.js가
             채운다. -->
        <div id="roomHeadBanner" class="room-head-banner" hidden>
          <div class="room-head-top">
            <span class="room-head-dot" aria-hidden="true"></span>
            <span class="room-head-kicker">알림에서 시작된 방</span>
            <span id="roomHeadTime" class="room-head-time"></span>
          </div>
          <div id="roomHeadTitle" class="room-head-title"></div>
          <div class="room-head-sub">오브에서 넘어왔습니다. 이 감시 건에 대해서만 이어서 이야기합니다 — 메인 대화와 섞이지 않습니다.</div>
        </div>
        <div class="history" id="history"></div>

        <!-- 커맨드 카드(AT-CH-001R, Paper 47쪽) — 입력줄과 컨트롤 스트립의 2행
             구조. 스트립에는 **실기능만** 올린다(soul.md §7 — 없는 기능을 암시하는
             장식 UI 금지): 점(설정)·CLI 필·모델 필·루틴 칩(활성 감시 수). -->
        <div class="input-stack" id="inputStack">
          <div class="input-row">
            <input id="input" class="input" placeholder="무엇이든 물어보세요" autofocus />
            <div class="lock-hint" id="lockHint" hidden>
              <span id="lockText">답변 중…</span>
              <span class="esc">ESC 중단</span>
            </div>
          </div>
          <div class="control-strip" id="controlStrip">
            <!-- 점은 두 역할을 겸한다: 대화 상태 표시 · 답변⇄그래프 모드 전환
                 (Paper 보드 05, 2026-08-26). 설정 진입은 사이드바 계정 메뉴(보드
                 16, lib/sidebar.js registerOpenSettings)로 옮겼다 — 커맨드바
                 ("설정", "계좌 관리")가 동등한 진입로이고, 점으로만 갈 수 있으면
                 soul.md §8 탈락 조건이다. 세 번째였던 "캔버스 확장 애니메이션의
                 중심점"은 리프 1.2.1에서 사라졌다 — 확장할 창이 없다. -->
            <button
              class="dot"
              id="dot"
              type="button"
              aria-label="답변·그래프 모드 전환"
              title="모드 전환"
            ></button>
            <!-- CLI 필 — runQuery의 실제 실행기(claude -p)를 표시한다. 클릭=설정 모드
                 (전환·계정은 거기서). 표시가 실행기와 어긋나면 정보 정직성 위반이다. -->
            <button id="cliPill" class="pill" type="button" title="활성 CLI — 설정에서 전환">CLAUDE</button>
            <!-- 루틴 칩 — 활성 감시 수. 백엔드 미기동이면 숨긴다(없는 감시를 있다고 표시하지 않는다). -->
            <span id="routineChip" class="routine-chip" hidden></span>
            <!-- 모드 칩 — 지금 캔버스 모드(답변/그래프)를 상시 보여준다(Paper 보드
                 05 "모드 칩 상시"). 점과 같은 동작을 하는 두 번째 진입로이기도
                 하다 — 브레인이 꺼져 있어도 숨기지 않는다(그래프 모드 자체는 늘
                 열 수 있고, 못 쓰는 이유는 캔버스 안에서 설명한다 — graphMode.
                 setAvailable 참고). -->
            <button id="graphPill" class="pill" type="button" title="답변 ⇄ 그래프">그래프</button>
            <span class="strip-spacer"></span>
            <!-- 모델 필 — athena:model-get 실상태 표시, 클릭=인라인 팝오버(새 창 아님). -->
            <button id="modelPill" class="pill" type="button" title="모델 · 추론 노력">기본 모델</button>
          </div>
          <!-- 모델 팝오버 — 창 안 오버레이. 유리 0.45+blur(카드 단계), 무채색.
               페이드 등장 금지(soul.md §7) — display 토글로 나타난다. -->
          <div id="modelPopover" class="model-popover" hidden></div>
        </div>
      </div>
    </section>
  </div>

    </div>

  </div>

  <!-- 창 크롬 — 모드·영역과 무관하게 **창**에 속하므로 #shell 밖 고정 오버레이다.
       부팅 연출 중에는 숨겼다가 shell.js revealChrome()에서 드러난다.
       닫기는 종료가 아니다 — 창을 숨기고 프로세스는 백그라운드에 남는다(트레이 복귀). -->
  <div id="dragStrip" class="titlebar" hidden aria-hidden="true"><span class="titlebar-label">Athena</span></div>

  <div id="winControls" class="win-controls" hidden>
    <button id="winMin" class="win-btn" type="button" aria-label="최소화" title="최소화 (Ctrl+M)"><span class="win-ic-min"></span></button>

  </div>
