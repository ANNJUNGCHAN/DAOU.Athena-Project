<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Athena — 대화</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/ui-kit.css" />
<link rel="stylesheet" href="chat.css" />
<link rel="stylesheet" href="styles/settings-cards.css" />
<link rel="stylesheet" href="styles/access.css" />
</head>
<body>
  <!-- 부팅(AT-SY-001) — 4단계 생성 시퀀스. 별도 스플래시가 아니라 대화 창 자신이
       생성되는 연출이다: 발광점(0ms) → 가로 확장(+180ms) → 세로 전개(+420ms, 유리 72%)
       → 창 확정(+620ms). 2026-08-18 사용자 지시로 4단계를 재정의했다: 전개의 종착은
       별도 로고 화면이 아니라 **평소 채팅바 그 자체**다(그립·점·입력줄). 확정된 바의
       입력줄에 ATHENA가 한 자씩 적혔다가 지워지고 placeholder로 돌아온 상태에서 실제
       창(#app)으로 스왑한다 — 부팅의 최대 크기는 채팅창(chatBaseH)을 넘지 않는다.
       시퀀스는 chat.js가 클래스 토글로 구동한다. -->
  <div id="boot" class="boot">
    <div class="boot-line" id="bootLine"></div>
    <div class="boot-panel" id="bootPanel">
      <div class="boot-grip"></div>
      <div class="boot-body"></div>
      <div class="boot-inputbar">
        <span class="boot-dot"></span>
        <span class="boot-name" id="bootName"></span>
        <span class="boot-cursor"></span>
        <span class="boot-ph" id="bootPh" hidden>무엇이든 물어보세요</span>
      </div>
    </div>
  </div>

  <div id="app" class="app glass" hidden>
    <div class="grip" id="grip" title="위로 끌어 이력을 펼친다"></div>

    <div class="history" id="history"></div>

    <div class="input-row">
      <!-- 점은 세 역할을 겸한다: 대화 상태 표시 · 캔버스 확장 애니메이션의 중심점 ·
           설정 진입(GLOSSARY.md §1). 누르면 새 창이 뜨는 게 아니라 **이 창이 설정
           모드로 바뀐다**(ui/DESIGN-SOUL.md:100, ui/soul.md §3). 커맨드바("설정",
           "계좌 관리")가 동등한 진입로이고, 점으로만 갈 수 있으면 §8 탈락 조건이다. -->
      <button
        class="dot"
        id="dot"
        type="button"
        aria-label="설정 열기"
        title="설정"
      ></button>
      <input id="input" class="input" placeholder="무엇이든 물어보세요… (Enter: 질문, Esc: 캔버스 접기)" autofocus />
      <span id="routineChip" class="routine-chip" hidden></span>
      <div class="lock-hint" id="lockHint" hidden>
        <span id="lockText">답변 중…</span>
        <span class="esc">ESC 중단</span>
      </div>
    </div>
  </div>

  <!-- 온보딩(AT-SY-002/003)·인증(AT-CV-OAUTH) — 새 창이 아니다. 대화 창(.app과
       같은 유리 패널)이 chatMaxH로 확장된 상태의 콘텐츠를 여기 채운다.
       lib/onboarding.js·lib/auth-screen.js가 #onboardBody를 그린다. -->
  <div id="onboard" class="app glass" hidden>
    <div id="onboardBody" class="onb-root"></div>
  </div>

  <!-- 설정 모드 — 온보딩·인증과 같은 문법이다. 새 창이 아니라 대화 창이 chatMaxH로
       확장된 상태의 콘텐츠다(ui/DESIGN-SOUL.md 도출된 규칙 3).
       Paper 43쪽(2026-08-18) 확정 — 헤더 + 좌 사이드바(#settingsNav, 화면·계좌·
       MCP 서버·모델 4종) + 우 패널(#settingsGrid). lib/settings-cards.js의
       renderNav()가 #settingsNav를, 화면/계좌/MCP/모델 각 render*()가
       #settingsGrid를 그린다 — #settingsGrid에 카드가 마운트되는 계약은
       그대로다(verify가 이 id를 찌른다). -->
  <div id="settings" class="app glass" hidden>
    <div class="settings-head">
      <span class="settings-title">설정</span>
      <span class="settings-hint">↑↓ 이동 · Enter 선택 · Tab 패널 이동 · Esc 닫기</span>
    </div>
    <div class="settings-body">
      <div id="settingsNav" class="settings-nav"></div>
      <div id="settingsGrid" class="settings-grid"></div>
    </div>
  </div>

  <!-- 주문 확인 모드(AT-CH-009, 2026-08-19 능동 에이전트 P4) — 유일하게 미착수였던
       모드의 실체. 온보딩·설정과 같은 형제 패널 문법: 열리면 #app이 물러나고
       창이 chatMaxH로 자란다. 프리필은 AI(루틴)가, 실행 버튼은 사람만
       (확정 결정 2·3). chat.js openOrderTicket()/closeOrderTicket()가 그린다. -->
  <div id="order" class="app glass" hidden>
    <div class="settings-head">
      <span class="settings-title">주문 티켓</span>
      <span class="settings-hint">Esc 닫기 — 실행 전에는 아무 일도 일어나지 않습니다</span>
    </div>
    <div id="orderBody" class="settings-grid"></div>
  </div>

  <!-- 창 제어(AT-CH-001, 2026-08-18) — frame:false라 OS 타이틀바가 없어 직접 배선한
       세 버튼. 특정 모드의 부품이 아니라 **창의 크롬**이므로 #app/#onboard/#settings
       밖 고정 오버레이다(모드가 바뀌어도 그대로). 부팅 연출 중에는 숨겼다가
       finishBoot에서 드러난다. 닫기는 종료가 아니다 — 두 창을 숨기고 프로세스는
       백그라운드에 남는다(트레이에서 복귀, main.js). -->
  <div id="winControls" class="win-controls" hidden>
    <button id="winMin" class="win-btn" type="button" aria-label="최소화" title="최소화 (Ctrl+M)"><span class="win-ic-min"></span></button>
    <button id="winMax" class="win-btn" type="button" aria-label="최대 높이로 확장" title="최대 높이로 확장"><span class="win-ic-max"></span></button>
    <button id="winClose" class="win-btn" type="button" aria-label="닫기 — 백그라운드 유지" title="닫기 — 백그라운드에 유지"><span class="win-ic-close"></span></button>
  </div>

  <div class="glass-sheen" aria-hidden="true"></div>

<!-- 렌더러 격리(2026-08-18, CLAUDE.md §6) — nodeIntegration:false라 require가
     없다. lib/*.js는 UMD 각주로 window.AthenaLib에 전역을 얹는 순수 <script>다.
     ui-kit이 onboarding/auth-screen/settings-cards보다 먼저 와야 한다. -->
<script src="lib/ui-kit.js"></script>
<script src="lib/edge-glow.js"></script>
<script src="lib/onboarding.js"></script>
<script src="lib/auth-screen.js"></script>
<script src="lib/routine-turn.js"></script>
<script src="lib/order-ticket.js"></script>
<script src="lib/settings-cards.js"></script>
<script src="chat.js"></script>
</body>
</html>
