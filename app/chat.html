<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Athena — 대화</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/ui-kit.css" />
<link rel="stylesheet" href="chat.css" />
<link rel="stylesheet" href="styles/access.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-gauge">
      <div class="boot-gauge-fill" id="gaugeFill"></div>
    </div>
    <div class="boot-label">ATHENA</div>
  </div>

  <div id="app" class="app glass" hidden>
    <div class="grip" id="grip" title="위로 끌어 이력을 펼친다"></div>

    <div class="history" id="history"></div>

    <div class="input-row">
      <div class="dot" id="dot"></div>
      <input id="input" class="input" placeholder="무엇이든 물어보세요… (Enter: 목업 질의, Esc: 캔버스 접기)" autofocus />
      <div class="lock-hint" id="lockHint" hidden>
        <span id="lockText">답변 중…</span>
        <span class="esc">ESC 중단</span>
      </div>
    </div>
  </div>

  <!-- 온보딩(AT-SY-002/003)·인증(AT-CV-OAUTH) — 새 창이 아니다. 대화 창(.app과
       같은 유리 패널)이 chatMaxH로 확장된 상태의 콘텐츠를 여기 채운다.
       lib/onboarding.js·lib/auth-screen.js가 #onboardBody를 그린다. -->
  <div id="onboard" class="app glass" hidden>
    <div id="onboardBody" class="onb-root"></div>
  </div>

  <div class="glass-sheen" aria-hidden="true"></div>

<script src="chat.js"></script>
</body>
</html>
