<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">관계와 원문을 함께 반환</title><desc id="desc">대상의 연결된 점과 선을 찾고 관계 방향과 시점, 근거 문장을 함께 돌려줘 답을 만드는 현재 구현</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs><rect width="1200" height="500" style="fill:#fff"/><g transform="translate(45 155)"><rect width="180" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="90" y="72" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">대상</text></g><g transform="translate(285 155)"><rect width="210" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="105" y="56" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">연결된 점·선</text><text x="105" y="89" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">관계 조회</text></g><g transform="translate(555 135)"><rect width="285" height="165" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="142" y="48" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:20px;font-weight:700">근거 묶음</text><text x="142" y="88" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">방향 · 시점</text><text x="142" y="121" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">근거 문장</text></g><g transform="translate(900 155)"><rect width="240" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="120" y="56" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">근거가 보이는 답</text><text x="120" y="89" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">원문 확인 가능</text></g><path d="M225 217H285" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M495 217H555" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M840 217H900" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/></svg>
