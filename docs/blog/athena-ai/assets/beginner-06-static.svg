<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">출처가 다른 두 입력 경로</title><desc id="desc">대화는 언어 모델이 근거 문장과 함께 추출하고 거래와 보유는 언어 모델 없이 정해진 규칙으로 변환해 출처와 함께 그래프에 저장하는 현재 구현</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs><rect width="1200" height="500" style="fill:#fff"/><rect x="60" y="115" width="180" height="105" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="150" y="178" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">대화</text><rect x="335" y="105" width="290" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="480" y="153" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">LLM 추출</text><text x="480" y="187" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">근거 문장 포함</text><rect x="60" y="275" width="180" height="105" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="150" y="322" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">거래 · 보유</text><text x="150" y="352" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">정형 데이터</text><rect x="335" y="265" width="290" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="480" y="313" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">정해진 규칙</text><text x="480" y="347" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">LLM 없이 규칙 변환</text><rect x="755" y="165" width="385" height="160" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="947" y="220" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:20px;font-weight:700">투자 지식 그래프</text><text x="947" y="258" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">관계 + 입력 출처</text><text x="947" y="288" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">한 번에 저장</text><path d="M240 167H335" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M240 327H335" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M625 167C690 167 690 225 755 225" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M625 327C690 327 690 265 755 265" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/></svg>
