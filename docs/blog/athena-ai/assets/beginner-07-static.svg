<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">다른 이름, 같은 대상</title><desc id="desc">반도체 산업과 반도체 업종, 반도체처럼 표현이 다른 일반 산업 엔티티를 이름과 주변 관계 유사도로 검사하고 유니온 파인드로 하나의 대표 대상에 묶는 현재 구현</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs><rect width="1200" height="500" style="fill:#fff"/><g transform="translate(60 120)"><rect width="230" height="55" rx="8" style="fill:#fff;stroke:#576AF9;stroke-width:2"/><text x="115" y="35" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">반도체 산업</text><rect y="75" width="230" height="55" rx="8" style="fill:#fff;stroke:#576AF9;stroke-width:2"/><text x="115" y="110" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">반도체 업종</text><rect y="150" width="230" height="55" rx="8" style="fill:#fff;stroke:#576AF9;stroke-width:2"/><text x="115" y="185" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">반도체</text></g><rect x="390" y="125" width="355" height="195" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="567" y="170" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">같은 대상인지 검사</text><text x="567" y="212" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">별칭 · 이름 Jaccard</text><text x="567" y="246" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">주변 관계 유사도</text><text x="567" y="280" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">Union-Find로 묶기</text><rect x="845" y="150" width="295" height="145" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="992" y="210" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:20px;font-weight:700">대표 1개</text><text x="992" y="250" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">이름과 별칭 유지</text><path d="M290 222H390" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M745 222H845" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/></svg>
