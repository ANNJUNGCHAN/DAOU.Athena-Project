<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">관심과 사실은 다릅니다</title><desc id="desc">배당이 궁금하다는 말은 관심으로, 열 주를 샀다는 말은 거래 사실로 구분해 기억하는 현재 구현 예시</desc><defs></defs><rect width="1200" height="500" style="fill:#fff"/><rect class="node-pulse" x="60" y="130" width="500" height="220" rx="8" style="animation-delay:0.00s;fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="100" y="190" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:24px">“배당이 궁금해요”</text><rect class="node-pulse" x="100" y="230" width="125" height="52" rx="8" style="animation-delay:0.25s;fill:#FAFAFC;stroke:#AEB4BE;stroke-width:1.5"/><text x="162" y="263" text-anchor="middle" fill="#0E20B2" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:22px;font-weight:700">관심</text><text x="100" y="320" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">궁금한 주제 · 보유 사실 아님</text><rect class="node-pulse" x="640" y="130" width="500" height="220" rx="8" style="animation-delay:0.50s;fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="680" y="190" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:24px">“10주 샀어요”</text><rect x="680" y="230" width="160" height="52" rx="8" fill="#fff"/><text x="760" y="263" text-anchor="middle" fill="#0E20B2" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:22px;font-weight:700">거래 사실</text><text x="680" y="320" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">수량과 종목을 확인해 저장</text><style>
    .flow-pulse{fill:none;stroke:#0E20B2;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 90;stroke-dashoffset:110;opacity:0;animation:flow-travel 5s linear infinite}
    .node-pulse{animation:node-emphasis 5s ease-in-out infinite}
    @keyframes flow-travel{0%,8%{stroke-dashoffset:110;opacity:0}12%{opacity:.85}45%{stroke-dashoffset:-10;opacity:.85}50%,100%{stroke-dashoffset:-10;opacity:0}}
    @keyframes node-emphasis{0%,15%,65%,100%{stroke-opacity:.65}35%,45%{stroke-opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow-pulse{display:none;animation:none}.node-pulse{animation:none}}
  </style></svg>
