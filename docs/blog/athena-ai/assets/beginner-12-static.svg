<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">현재 검색과 PPR 확장안 평가 계획</title><desc id="desc">현재 BM25와 관계 조회 방식과 실험할 PPR 방식을 식별 정확도, 원문 도달률, 오연결률, 95백분위 지연으로 비교하는 아직 수행하지 않은 계획</desc><defs></defs><rect width="1200" height="500" style="fill:#fff"/><rect x="60" y="125" width="355" height="180" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="237" y="180" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:21px;font-weight:700">현재 방식</text><text x="237" y="224" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">BM25 + 관계 조회</text><text x="237" y="260" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">구현됨</text><rect x="455" y="125" width="355" height="180" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="632" y="180" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:21px;font-weight:700">실험 후보</text><text x="632" y="224" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">PPR 기반 탐색</text><text x="632" y="260" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">아직 미구현</text><rect x="850" y="125" width="290" height="180" rx="8" style="fill:#FAFAFC;stroke:#AEB4BE;stroke-width:1.5"/><text x="995" y="170" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:21px;font-weight:700">같이 볼 지표</text><text x="995" y="207" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">식별 정확도 · 원문 도달률</text><text x="995" y="240" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">오연결률 · p95</text><text x="995" y="273" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">숫자는 측정 후 기록</text><rect x="60" y="365" width="1080" height="70" rx="8" fill="#FAFAFC"/><text x="600" y="408" text-anchor="middle" fill="#0E20B2" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:21px;font-weight:700">평가 계획 · 아직 미측정 · 정확도와 지연을 함께 비교</text></svg>
