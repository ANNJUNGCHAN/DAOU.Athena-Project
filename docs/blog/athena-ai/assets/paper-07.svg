<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">재구성 도식 7. HippoRAG 오프라인 인덱싱</title>
  <desc id="desc">문단에서 OpenIE 지식 그래프와 동의어 간선, 노드 문단 행렬을 만드는 논문 방법 설명도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007d79"/></marker>
    <style>.bg{fill:#f6f8fa}.card{fill:#fff;stroke:#cbd6de;stroke-width:2}.actual{fill:#e8f5f3;stroke:#007d79;stroke-width:2}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.sub{font-size:17px}.caption{font-size:14px;fill:#506579}.line{fill:none;stroke:#007d79;stroke-width:3;marker-end:url(#arrow)}.edge{stroke:#007d79;stroke-width:3}.syn{stroke:#007d79;stroke-width:3;stroke-dasharray:7 6}</style>
  </defs>
  <rect class="bg" width="1200" height="600" rx="24"/>
  <text class="t h" x="58" y="58">도식 7 · 오프라인: 문단을 연상 그래프로</text>
  <g transform="translate(55 178)"><rect class="actual" width="170" height="120" rx="18"/><text class="t label" x="52" y="48">문단</text><text class="t sub" x="35" y="82">원문 corpus</text></g>
  <path class="line" d="M225 238H290"/>
  <g transform="translate(290 158)"><rect class="actual" width="230" height="160" rx="18"/><text class="t label" x="31" y="48">LLM OpenIE</text><text class="t sub" x="31" y="86">명사구 노드 N</text><text class="t sub" x="31" y="118">관계 간선 E</text></g>
  <path class="line" d="M520 238H575"/>
  <g transform="translate(575 118)"><rect class="card" width="320" height="255" rx="20"/><text class="t label" x="25" y="45">명사구 · 관계 그래프</text><line class="edge" x1="85" y1="118" x2="160" y2="82"/><line class="edge" x1="160" y1="82" x2="242" y2="130"/><line class="syn" x1="85" y1="118" x2="122" y2="190"/><circle cx="85" cy="118" r="24" fill="#007d79"/><circle cx="160" cy="82" r="20" fill="#84c4be"/><circle cx="242" cy="130" r="22" fill="#007d79"/><circle cx="122" cy="190" r="20" fill="#84c4be"/><text class="t sub" x="25" y="230">cosine ≥ τ → 동의어 간선 E′</text></g>
  <path class="line" d="M895 238H945"/>
  <g transform="translate(945 158)"><rect class="actual" width="205" height="160" rx="18"/><text class="t label" x="27" y="46">행렬 P 유지</text><text class="t sub" x="27" y="80">노드 × 문단</text><g fill="#fff" stroke="#007d79"><rect x="28" y="103" width="28" height="24"/><rect x="56" y="103" width="28" height="24"/><rect x="84" y="103" width="28" height="24"/><rect x="28" y="127" width="28" height="24"/><rect x="56" y="127" width="28" height="24"/><rect x="84" y="127" width="28" height="24"/></g></g>
  <rect x="58" y="430" width="1090" height="78" rx="16" fill="#fff" stroke="#d6dfe6"/><text class="t sub" x="82" y="462">P[i,j] = 명사구 i가 원문 문단 j에 등장한 횟수</text><text class="t sub" x="82" y="491">OpenIE 간선과 embedding 동의어 간선을 함께 인덱싱</text>
  <text class="t caption" x="58" y="556">출처 · HippoRAG v3 §2.3 · https://arxiv.org/abs/2405.14831v3</text>
</svg>
