<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">이름보다 조건을 함께 봅니다</title><desc id="desc">질문의 어휘 점수와 입력 형식, 계좌 조건을 차례로 검사해 실행 가능한 후보를 고르는 현재 구현</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#98A0AC"/></marker></defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <g fill="#FFFFFF" stroke="#263044" stroke-width="1.5"><rect x="60" y="150" width="185" height="80" rx="8"/><rect x="325" y="130" width="250" height="120" rx="8"/><rect x="655" y="130" width="250" height="120" rx="8"/></g><rect class="node-pulse" x="985" y="130" width="155" height="120" rx="8" fill="#EEF0FF" stroke="#576AF9" stroke-width="2" style="animation-delay:0.00s"/><rect class="node-pulse" x="655" y="315" width="250" height="62" rx="8" fill="#FAFAFC" stroke="#AEB4BE" stroke-width="1.5" style="animation-delay:0.25s"/>
  <g fill="#14171D" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><text x="152" y="198" font-size="20" font-weight="700">질문</text><text x="450" y="171" font-size="20" font-weight="700">어휘 점수</text><text x="450" y="205" font-size="17">차트 · 주가 흐름 · 일봉</text><text x="450" y="231" fill="#626B76" font-size="16">가까운 후보 찾기</text><text x="780" y="171" font-size="20" font-weight="700">조건 검사</text><text x="780" y="205" font-size="17">입력 형식 · 계좌 조건</text><text x="780" y="231" fill="#626B76" font-size="16">모두 충족?</text><text x="1062" y="181" fill="#0E20B2" font-size="19" font-weight="700">실행 가능</text><text x="1062" y="210" fill="#0E20B2" font-size="19" font-weight="700">후보</text><text x="780" y="353" fill="#626B76" font-size="17">조건 불충족 · 제외</text></g>
  <path d="M245 190H325" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M575 190H655" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M905 190H985" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M780 250V315" fill="none" stroke="#98A0AC" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#g)"/><g fill="#626B76" font-family="Consolas,monospace" font-size="14"><text x="267" y="181">tokens</text><text x="596" y="181">validate</text><text x="928" y="181">pass</text><text x="793" y="286">reject</text></g>

<style>
    .flow-pulse{fill:none;stroke:#0E20B2;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 90;stroke-dashoffset:110;opacity:0;animation:flow-travel 5s linear infinite}
    .node-pulse{animation:node-emphasis 5s ease-in-out infinite}
    @keyframes flow-travel{0%,8%{stroke-dashoffset:110;opacity:0}12%{opacity:.85}45%{stroke-dashoffset:-10;opacity:.85}50%,100%{stroke-dashoffset:-10;opacity:0}}
    @keyframes node-emphasis{0%,15%,65%,100%{stroke-opacity:.65}35%,45%{stroke-opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow-pulse{display:none;animation:none}.node-pulse{animation:none}}
  </style><path class="flow-pulse" d="M245 190H325" pathLength="100" style="animation-delay:0.00s"/><path class="flow-pulse" d="M575 190H655" pathLength="100" style="animation-delay:0.45s"/><path class="flow-pulse" d="M905 190H985" pathLength="100" style="animation-delay:0.90s"/><path class="flow-pulse" d="M780 250V315" pathLength="100" style="animation-delay:1.35s"/></svg>
