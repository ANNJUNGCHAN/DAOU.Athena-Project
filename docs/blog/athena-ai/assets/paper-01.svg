<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ToolRerank의 단계적 도구 검색 파이프라인</title>
  <desc id="desc">듀얼 인코더 검색, 적응형 후보 절단, 크로스 인코더 재정렬, 계층 인식 선택을 거쳐 상위 도구를 남기는 논문 방법</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007d79"/></marker><style>.bg{fill:#f6f8fa}.card{fill:#fff;stroke:#cad4dd;stroke-width:2}.focus{fill:#e8f5f3;stroke:#007d79;stroke-width:2}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:17px}.line{stroke:#007d79;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="600" rx="24"/><text class="t h" x="64" y="62">ToolRerank · 후보를 줄인 뒤 정밀하게 재정렬한다</text>
  <g transform="translate(55 170)"><rect class="card" width="190" height="130" rx="18"/><text class="t l" x="95" y="50" text-anchor="middle">듀얼 인코더</text><text class="t s" x="95" y="84" text-anchor="middle">빠른 후보 검색</text></g>
  <g transform="translate(285 150)"><rect class="focus" width="220" height="170" rx="18"/><text class="t l" x="110" y="45" text-anchor="middle">적응형 절단</text><text class="t s" x="110" y="82" text-anchor="middle">학습에서 본 도구 10</text><text class="t s" x="110" y="111" text-anchor="middle">처음 보는 도구 50</text><text class="t s" x="110" y="143" text-anchor="middle">Table 5 최적 설정</text></g>
  <g transform="translate(545 170)"><rect class="card" width="190" height="130" rx="18"/><text class="t l" x="95" y="50" text-anchor="middle">크로스 인코더</text><text class="t s" x="95" y="84" text-anchor="middle">정밀 재정렬</text></g>
  <g transform="translate(775 170)"><rect class="focus" width="190" height="130" rx="18"/><text class="t l" x="95" y="50" text-anchor="middle">계층 인식</text><text class="t s" x="95" y="84" text-anchor="middle">도구·API 구조 반영</text></g>
  <g transform="translate(1005 170)"><rect class="card" width="140" height="130" rx="18"/><text class="t l" x="70" y="50" text-anchor="middle">Top-k</text><text class="t s" x="70" y="84" text-anchor="middle">최종 후보</text></g>
  <path class="line" d="M245 235H285"/><path class="line" d="M505 235H545"/><path class="line" d="M735 235H775"/><path class="line" d="M965 235H1005"/>
  <rect x="64" y="410" width="1072" height="92" rx="16" fill="#fff" stroke="#d8e0e7"/><text class="t s" x="90" y="447">seen / unseen은 학습 데이터에서 본 도구인지의 구분이다.</text><text class="t s" x="90" y="480">서버가 현재 사용 가능한지와는 다른 개념이다.</text>
  <text class="t s" x="64" y="552">Zheng et al., 2024 · ToolRerank · Table 5</text>
</svg>
