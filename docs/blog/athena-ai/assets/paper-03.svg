<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ToolBench 여섯 하위 집합의 Recall at 5 비교</title><desc id="desc">ToolBench의 여섯 하위 집합 평균에서 Rerank-30은 80.3, ToolRerank는 84.2를 기록한 논문 표 결과</desc>
  <defs><style>.bg{fill:#f6f8fa}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.grid{stroke:#d8e0e7;stroke-width:2}.old{fill:#91a0ae}.new{fill:#007d79}</style></defs>
  <rect class="bg" width="1200" height="600" rx="24"/><text class="t h" x="64" y="62">ToolBench 전체 평균 · Recall@5</text><text class="t s" x="64" y="94">여섯 하위 집합의 논문 보고값</text>
  <line class="grid" x1="270" y1="420" x2="1090" y2="420"/><line class="grid" x1="270" y1="145" x2="270" y2="420"/>
  <g class="t s"><text x="265" y="447">0</text><text x="425" y="447">20</text><text x="590" y="447">40</text><text x="755" y="447">60</text><text x="920" y="447">80</text><text x="1070" y="447">100</text></g>
  <text class="t l" x="64" y="222">Rerank-30</text><rect class="old" x="270" y="180" width="658" height="66" rx="10"/><text class="t l" x="948" y="222">80.3</text>
  <text class="t l" x="64" y="347">ToolRerank</text><rect class="new" x="270" y="305" width="690" height="66" rx="10"/><text class="t l" x="980" y="347">84.2</text>
  <rect x="64" y="485" width="1072" height="54" rx="14" fill="#fff" stroke="#d8e0e7"/><text class="t s" x="88" y="519">출처: Zheng et al., 2024 · ToolRerank · Table 3 · 논문 결과</text>
</svg>
