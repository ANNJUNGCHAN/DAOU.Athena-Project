<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">질문에서 대상을 찾습니다</title><desc id="desc">식별자를 직접 조회하고 없으면 이름과 별칭 및 BM25 상위 다섯 후보를 찾은 뒤 정확한 이름 하나나 유일 후보를 확정하는 현재 구현</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs><rect width="1200" height="500" style="fill:#fff"/><rect x="45" y="155" width="180" height="130" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="135" y="208" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">질문의 대상</text><text x="135" y="244" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">ID 또는 이름</text><rect x="285" y="145" width="205" height="150" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="387" y="192" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">1. ID 직접 조회</text><text x="387" y="230" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">있으면 바로 확정</text><text x="387" y="262" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">없으면 이름 검색</text><rect x="550" y="135" width="250" height="170" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="675" y="182" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:19px;font-weight:700">2. 이름 후보</text><text x="675" y="220" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:17px">이름 · 별칭</text><text x="675" y="251" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:17px">BM25 최대 5개</text><text x="675" y="282" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:17px">ID가 없을 때만</text><rect x="860" y="135" width="295" height="170" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="1007" y="182" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">3. 확정 조건</text><text x="1007" y="220" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">정확한 이름 1개</text><text x="1007" y="251" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">또는 후보가 1개</text><text x="1007" y="282" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:17px">그 외에는 선택 요청</text><path d="M225 220H285" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M490 220H550" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M800 220H860" style="fill:none;stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/></svg>
