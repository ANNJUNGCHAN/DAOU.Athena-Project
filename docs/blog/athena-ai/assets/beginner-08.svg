<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">세 가지 기억 방식 평가 계획</title><desc id="desc">기억 없음과 대화 기록, 출처 그래프를 추출 정확도, 오인 기억, 병합 오류, 정정 반영률로 비교하는 아직 수행하지 않은 평가 계획</desc><defs></defs><rect width="1200" height="500" style="fill:#fff"/><rect class="node-pulse" x="60" y="130" width="275" height="145" rx="8" style="animation-delay:0.00s;fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="197" y="188" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">A · 기억 없음</text><text x="197" y="228" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">매번 새로 판단</text><rect class="node-pulse" x="370" y="130" width="275" height="145" rx="8" style="animation-delay:0.25s;fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="507" y="188" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">B · 대화 기록</text><text x="507" y="228" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">문장 묶음 검색</text><rect class="node-pulse" x="680" y="130" width="275" height="145" rx="8" style="animation-delay:0.50s;fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="817" y="188" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:20px;font-weight:700">C · 출처 그래프</text><text x="817" y="228" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">관계와 근거 저장</text><rect class="node-pulse" x="995" y="130" width="145" height="145" rx="8" style="animation-delay:0.75s;fill:#FAFAFC;stroke:#AEB4BE;stroke-width:1.5"/><text x="1067" y="177" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">측정</text><text x="1067" y="211" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">추출·오인</text><text x="1067" y="241" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">병합·정정</text><rect x="60" y="350" width="1080" height="82" rx="8" fill="#FAFAFC"/><text x="600" y="382" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">추출 정확도 · 오인 기억 · 병합 오류 · 정정 반영률</text><text x="600" y="414" text-anchor="middle" fill="#0E20B2" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:20px;font-weight:700">평가 계획 · 아직 미측정</text><style>
    .flow-pulse{fill:none;stroke:#0E20B2;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 90;stroke-dashoffset:110;opacity:0;animation:flow-travel 5s linear infinite}
    .node-pulse{animation:node-emphasis 5s ease-in-out infinite}
    @keyframes flow-travel{0%,8%{stroke-dashoffset:110;opacity:0}12%{opacity:.85}45%{stroke-dashoffset:-10;opacity:.85}50%,100%{stroke-dashoffset:-10;opacity:0}}
    @keyframes node-emphasis{0%,15%,65%,100%{stroke-opacity:.65}35%,45%{stroke-opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow-pulse{display:none;animation:none}.node-pulse{animation:none}}
  </style></svg>
