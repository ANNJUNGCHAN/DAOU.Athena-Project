<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Figure 6. 출처와 명시성은 다른 축</title>
  <desc id="desc">정보가 어디서 왔는지를 나타내는 tier와 문장에서 얼마나 명시적인지를 나타내는 confidence label을 분리한 구조도</desc>
  <style>.bg{fill:#f6f8fa}.box{fill:#fff;stroke:#cad4dd;stroke-width:2}.act{fill:#e8f5f3;stroke:#007d79;stroke-width:2}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:17px}</style>
  <rect class="bg" width="1200" height="600" rx="24"/><text class="t h" x="64" y="60">Figure 6 · 출처와 명시성은 서로 독립이다</text>
  <g transform="translate(70 125)"><rect class="act" width="480" height="250" rx="20"/><text class="t l" x="28" y="48">Tier · 어디서 온 정보인가?</text><rect x="28" y="78" width="130" height="54" rx="12" fill="#fff"/><text class="t s" x="46" y="112">deterministic</text><rect x="174" y="78" width="140" height="54" rx="12" fill="#fff"/><text class="t s" x="192" y="112">conversational</text><rect x="330" y="78" width="120" height="54" rx="12" fill="#fff"/><text class="t s" x="355" y="112">manual</text><text class="t s" x="28" y="184">출처의 생성 경로를 기록</text><text class="t s" x="28" y="216">신뢰 확률을 뜻하지 않음</text></g>
  <g transform="translate(650 125)"><rect class="box" width="480" height="250" rx="20"/><text class="t l" x="28" y="48">Confidence · 얼마나 명시적인가?</text><rect x="28" y="78" width="120" height="54" rx="12" fill="#e8f5f3"/><text class="t s" x="45" y="112">EXTRACTED</text><rect x="166" y="78" width="120" height="54" rx="12" fill="#e8f5f3"/><text class="t s" x="187" y="112">INFERRED</text><rect x="304" y="78" width="145" height="54" rx="12" fill="#e8f5f3"/><text class="t s" x="320" y="112">AMBIGUOUS</text><text class="t s" x="28" y="184">문장 표현의 명시성을 기록</text><text class="t s" x="28" y="216">사실 여부의 확률이 아님</text></g>
  <rect x="150" y="425" width="900" height="110" rx="18" fill="#fff" stroke="#d8e0e7"/><text class="t l" x="184" y="468">교육용 예시</text><text class="t s" x="184" y="505">“배당주가 궁금해요” → conversational · 명시적 언급이 보유 사실을 의미하지 않음</text>
</svg>
