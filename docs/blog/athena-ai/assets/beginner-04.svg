<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">도구 선택 품질 평가 계획</title><desc id="desc">질문 백 개로 후보 누락률, 오선택률, 차트 완성률, 95백분위 지연을 측정해 도입을 판단하는 아직 수행하지 않은 평가 계획</desc><defs></defs><rect width="1200" height="500" style="fill:#fff"/><rect x="60" y="130" width="220" height="180" rx="26" style="fill:#0E20B2"/><text x="170" y="200" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#fff;font-size:21px;font-weight:700">질문 100개</text><text x="170" y="238" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#fff;font-size:18px">고정 평가 세트</text><text x="170" y="270" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#fff;font-size:18px">숫자는 계획 예시</text><rect x="335" y="130" width="805" height="180" rx="26" style="fill:#F4F5F8;stroke:#EEF0F4;stroke-width:2"/><text x="375" y="175" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:21px;font-weight:700">같이 볼 지표</text><g><rect x="375" y="205" width="155" height="52" rx="26" style="fill:#EEF0FF"/><text x="452" y="237" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">후보 누락률</text><rect x="550" y="205" width="145" height="52" rx="26" style="fill:#EEF0FF"/><text x="622" y="237" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">오선택률</text><rect x="715" y="205" width="165" height="52" rx="26" style="fill:#EEF0FF"/><text x="797" y="237" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">차트 완성률</text><rect x="900" y="205" width="150" height="52" rx="26" style="fill:#EEF0FF"/><text x="975" y="237" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">p95 지연</text></g><rect x="60" y="365" width="1080" height="70" rx="20" fill="#F4F5F8"/><text x="600" y="408" text-anchor="middle" fill="#0E20B2" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:21px;font-weight:700">평가 계획 · 아직 미측정 · 네 지표를 함께 보고 도입 판단</text></svg>
