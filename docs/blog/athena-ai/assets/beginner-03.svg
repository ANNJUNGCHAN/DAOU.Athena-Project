<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">애매할 때만 작은 경쟁</title><desc id="desc">두 분류기가 이미 좁힌 최대 세 후보 안에서 도구를 분류하고 형식을 먼저 통과한 한 답을 선택한 뒤 서버가 실제 데이터로 차트를 그리는 현재 구현</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <g fill="#FFFFFF" stroke="#263044" stroke-width="1.5"><rect x="55" y="190" width="170" height="76" rx="8"/><rect x="300" y="125" width="170" height="76" rx="8"/><rect x="300" y="285" width="170" height="76" rx="8"/><rect x="545" y="125" width="170" height="76" rx="8"/><rect x="545" y="285" width="170" height="76" rx="8"/></g><rect class="node-pulse" x="790" y="175" width="170" height="106" rx="8" fill="#EEF0FF" stroke="#576AF9" stroke-width="2" style="animation-delay:0.00s"/><rect class="node-pulse" x="1030" y="175" width="130" height="106" rx="8" fill="#FFFFFF" stroke="#263044" stroke-width="1.5" style="animation-delay:0.25s"/>
  <g fill="#14171D" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><text x="140" y="236" font-size="19" font-weight="700">애매한 질문</text><text x="385" y="158" font-size="19" font-weight="700">분류기 A</text><text x="385" y="184" fill="#626B76" font-size="16">후보 최대 3</text><text x="385" y="318" font-size="19" font-weight="700">분류기 B</text><text x="385" y="344" fill="#626B76" font-size="16">후보 최대 3</text><text x="630" y="158" font-size="18" font-weight="700">형식 검사 A</text><text x="630" y="318" font-size="18" font-weight="700">형식 검사 B</text><text x="875" y="213" fill="#0E20B2" font-size="19" font-weight="700">첫 유효 응답</text><text x="875" y="240" fill="#0E20B2" font-size="17">1개 선택</text><text x="875" y="264" fill="#626B76" font-size="15">전체 동시 4 제한</text><text x="1095" y="213" font-size="18" font-weight="700">서버 실행</text><text x="1095" y="240" fill="#626B76" font-size="15">실제 가격</text><text x="1095" y="263" fill="#626B76" font-size="15">차트</text></g>
  <path d="M225 228H260V163H300" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M225 228H260V323H300" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M470 163H545" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M470 323H545" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M715 163H750V210H790" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M715 323H750V246H790" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M960 228H1030" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><g fill="#626B76" font-family="Consolas,monospace" font-size="14"><text x="245" y="151">path A</text><text x="245" y="346">path B</text><text x="487" y="154">validate</text><text x="487" y="314">validate</text><text x="971" y="218">dispatch</text></g>

<style>
    .flow-pulse{fill:none;stroke:#0E20B2;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 90;stroke-dashoffset:110;opacity:0;animation:flow-travel 5s linear infinite}
    .node-pulse{animation:node-emphasis 5s ease-in-out infinite}
    @keyframes flow-travel{0%,8%{stroke-dashoffset:110;opacity:0}12%{opacity:.85}45%{stroke-dashoffset:-10;opacity:.85}50%,100%{stroke-dashoffset:-10;opacity:0}}
    @keyframes node-emphasis{0%,15%,65%,100%{stroke-opacity:.65}35%,45%{stroke-opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow-pulse{display:none;animation:none}.node-pulse{animation:none}}
  </style><path class="flow-pulse" d="M225 228H260V163H300" pathLength="100" style="animation-delay:0.00s"/><path class="flow-pulse" d="M225 228H260V323H300" pathLength="100" style="animation-delay:0.00s"/><path class="flow-pulse" d="M470 163H545" pathLength="100" style="animation-delay:0.45s"/><path class="flow-pulse" d="M470 323H545" pathLength="100" style="animation-delay:0.45s"/><path class="flow-pulse" d="M715 163H750V210H790" pathLength="100" style="animation-delay:0.90s"/><path class="flow-pulse" d="M715 323H750V246H790" pathLength="100" style="animation-delay:0.90s"/><path class="flow-pulse" d="M960 228H1030" pathLength="100" style="animation-delay:1.35s"/></svg>
