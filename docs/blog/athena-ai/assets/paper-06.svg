  <text class="t l" x="64" y="199">링크·진화 제거</text><rect class="muted" x="350" y="160" width="176" height="58" rx="9"/><text class="t l" x="544" y="199">9.65</text>
  <text class="t l" x="64" y="309">진화 제거</text><rect class="mid" x="350" y="270" width="390" height="58" rx="9"/><text class="t l" x="758" y="309">21.35</text>
  <text class="t l" x="64" y="419">A-MEM</text><rect class="new" x="350" y="380" width="493" height="58" rx="9"/><text class="t l" x="861" y="419">27.02</text>
