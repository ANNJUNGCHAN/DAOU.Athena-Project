<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">LoCoMo 멀티홉 질문에서 A-MEM 구성요소 제거 비교</title><desc id="desc">GPT-4o-mini 기준 링크와 진화를 모두 제거하면 9.65, 진화만 제거하면 21.35, 전체 A-MEM은 27.02 F1을 기록한 논문 표</desc>
  <defs><style>.bg{fill:#f6f8fa}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:17px}.grid{stroke:#d8e0e7;stroke-width:2}.muted{fill:#91a0ae}.mid{fill:#58aaa6}.new{fill:#007d79}</style></defs>
  <rect class="bg" width="1200" height="600" rx="24"/><text class="t h" x="64" y="62">LoCoMo 멀티홉 F1 · GPT-4o-mini</text><text class="t s" x="64" y="94">A-MEM 구성요소 제거 실험</text>
  <line class="grid" x1="350" y1="445" x2="1080" y2="445"/><line class="grid" x1="350" y1="135" x2="350" y2="445"/>
