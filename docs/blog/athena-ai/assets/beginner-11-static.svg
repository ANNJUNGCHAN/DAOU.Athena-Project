<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">복잡한 연결에 짧은 이름표</title><desc id="desc">노드 차수를 계산하고 클러스터를 만든 뒤 대표 노드 최대 열두 개를 언어 모델에 전달해 짧은 라벨을 만들고 같은 클러스터는 캐시를 쓰는 현재 구현</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs><rect width="1200" height="500" style="fill:#fff"/><g transform="translate(40 155)"><rect width="170" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="85" y="56" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">차수 계산</text><text x="85" y="89" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">연결 수</text></g><g transform="translate(260 155)"><rect width="170" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="85" y="56" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">클러스터 묶기</text><text x="85" y="89" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">modularity</text></g><g transform="translate(480 145)"><rect width="200" height="145" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="100" y="50" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">대표점 선택</text><text x="100" y="88" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">차수 상위</text><text x="100" y="119" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">최대 12개</text></g><g transform="translate(730 145)"><rect width="190" height="145" rx="8" style="fill:#EEF0FF;stroke:#576AF9;stroke-width:2"/><text x="95" y="50" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:19px;font-weight:700">LLM 라벨</text><text x="95" y="88" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">짧은 한국어</text><text x="95" y="119" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#0E20B2;font-size:18px">실패 시 규칙</text></g><g transform="translate(970 155)"><rect width="180" height="125" rx="8" style="fill:#FFFFFF;stroke:#263044;stroke-width:1.5"/><text x="90" y="56" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#14171D;font-size:19px;font-weight:700">같은 클러스터</text><text x="90" y="89" text-anchor="middle" style="font-family:Daki,DakiL,sans-serif;fill:#626B76;font-size:18px">캐시 재사용</text></g><path d="M210 217H260" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M430 217H480" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M680 217H730" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/><path d="M920 217H970" style="stroke:#576AF9;stroke-width:2;marker-end:url(#a)"/></svg>
