<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">한 문장이 차트가 되기까지</title><desc id="desc">질문을 해석하고 도구와 금융 데이터를 확인한 뒤 차트를 표시하는 현재 구현 흐름</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>


  <g fill="#FFFFFF" stroke="#263044" stroke-width="1.5">
    <rect x="60" y="150" width="180" height="78" rx="8"/><rect x="325" y="150" width="190" height="78" rx="8"/><rect x="600" y="150" width="190" height="78" rx="8"/>
    <rect x="600" y="310" width="190" height="78" rx="8"/><rect x="875" y="310" width="190" height="78" rx="8"/>
  </g>
  <g fill="#14171D" font-family="Daki,DakiL,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="150" y="198">질문</text><text x="420" y="188">요청 해석</text><text x="420" y="213" fill="#626B76" font-size="16" font-weight="400">무엇을 볼까?</text><text x="695" y="188">도구 확인</text><text x="695" y="213" fill="#626B76" font-size="16" font-weight="400">실행할 수 있나?</text><text x="695" y="348">금융 데이터</text><text x="695" y="373" fill="#626B76" font-size="16" font-weight="400">서버 조회</text><text x="970" y="358">차트</text>
  </g>
  <path d="M240 189H325" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M515 189H600" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M695 228V310" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/><path d="M790 349H875" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#626B76" font-family="Consolas,monospace" font-size="14"><text x="264" y="180">intent</text><text x="540" y="180">contract</text><text x="708" y="274">selected</text><text x="816" y="340">prices</text></g>

</svg>
