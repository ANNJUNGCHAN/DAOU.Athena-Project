<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ToolRerank의 단일 도구와 다중 도구 계층 처리</title><desc id="desc">단일 도구 요청은 선택 도구의 API를 우선하고 다중 도구 요청은 API 그래프의 연결 성분에서 상위 후보를 유지한다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007d79"/></marker><style>.bg{fill:#f6f8fa}.box{fill:#fff;stroke:#cad4dd;stroke-width:2}.hi{fill:#e8f5f3;stroke:#007d79;stroke-width:2}.t{font-family:'Malgun Gothic',sans-serif;fill:#152a42}.h{font-size:28px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.e{stroke:#007d79;stroke-width:3}.dash{stroke:#91a0ae;stroke-width:2;stroke-dasharray:7 7}</style></defs>
  <rect class="bg" width="1200" height="600" rx="24"/><text class="t h" x="64" y="60">계층 정보는 요청 유형에 따라 다르게 쓴다</text>
  <rect class="box" x="64" y="110" width="500" height="380" rx="20"/><text class="t l" x="94" y="153">단일 도구 요청</text><rect class="hi" x="120" y="205" width="170" height="90" rx="16"/><text class="t l" x="205" y="258" text-anchor="middle">선택 도구</text><line class="e" x1="290" y1="250" x2="390" y2="210"/><line class="e" x1="290" y1="250" x2="390" y2="290"/><circle class="hi" cx="430" cy="195" r="42"/><circle class="hi" cx="430" cy="305" r="42"/><text class="t s" x="430" y="201" text-anchor="middle">API 1</text><text class="t s" x="430" y="311" text-anchor="middle">API 2</text><text class="t s" x="94" y="425">선택한 도구 내부 API를 우선한다.</text>
  <rect class="box" x="604" y="110" width="532" height="380" rx="20"/><text class="t l" x="634" y="153">다중 도구 요청</text><circle class="hi" cx="700" cy="235" r="34"/><circle class="hi" cx="810" cy="205" r="34"/><circle class="hi" cx="830" cy="315" r="34"/><circle class="box" cx="980" cy="215" r="34"/><circle class="box" cx="1030" cy="325" r="34"/><line class="e" x1="734" y1="226" x2="776" y2="214"/><line class="e" x1="721" y1="262" x2="803" y2="292"/><line class="e" x1="816" y1="239" x2="824" y2="281"/><line class="dash" x1="864" y1="300" x2="996" y2="230"/><line class="e" x1="1000" y1="246" x2="1018" y2="294"/><text class="t s" x="634" y="385">노드 = API · 간선 = 같은 도구 또는 cosine &gt; τₘ</text><text class="t s" x="634" y="425">연결 성분마다 상위 n개를 유지한다.</text>
  <text class="t s" x="64" y="552">Zheng et al., 2024 · ToolRerank · hierarchy-aware reranking</text>
</svg>
